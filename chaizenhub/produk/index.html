<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Produk · Chaizenhub</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="/assets/theme.css">

<body><div id="hdr"></div>

<div class="relative flex flex-wrap gap-2 mt-6 text-xs md:text-sm"><span class="bg-[#FFF8E7]/15 rounded-full px-3 py-1.5">⚡ Proses ±5 detik</span><span class="bg-[#FFF8E7]/15 rounded-full px-3 py-1.5">↺ Gagal = refund</span><span class="bg-[#FFF8E7]/15 rounded-full px-3 py-1.5">Buka 24 jam</span></div>
</section>
<div class="grid lg:grid-cols-[1fr_370px] gap-5 md:gap-6 mt-5 md:mt-6 items-start">
<div class="space-y-4 md:space-y-5">

<section id="s3" class="cardx rounded-[24px] p-5 md:p-7 rise"><div class="flex items-center gap-3"><span id="lc" class="num">3</span><p id="nl" class="font-semibold text-lg">Pilih nominal</p></div><div id="it" class="grid grid-cols-2 sm:grid-cols-3 gap-2.5 md:gap-3 mt-4"></div></section>

</div></main>
<div class="lg:hidden fixed bottom-0 inset-x-0 z-40 px-3 pb-[max(10px,env(safe-area-inset-bottom))]"><div class="bg-[#1E0A08] text-[#FFF8E7] rounded-[22px] pl-5 pr-2 py-2 flex items-center gap-3 shadow-[0_14px_30px_-12px_rgba(30,10,8,.5)]"><div class="flex-1 min-w-0"><p id="mi" class="text-[11px] text-[#FFF8E7]/60 truncate">Pilih nominal dulu</p><p id="mt" class="disp text-lg font-bold leading-tight">Rp0</p></div><button id="mgo" disabled class="bg-[#FFF8E7] text-[#930500] font-bold rounded-2xl px-5 py-3.5 disabled:opacity-40">Bayar →</button></div></div>
<footer id="ftr"></footer>
<script src="/assets/app.js"></script><script>
shell("Produk",{hideFootMobile:1});
const q=new URLSearchParams(location.search),k=D[q.get("s")]?q.get("s"):"pulsa",x=D[k];let P=x.auto?null:x.prov[0],I=null;
document.title=x.t+" · Chaizenhub";ic.innerHTML=svg(k,"w-7 h-7 md:w-9 md:h-9");cat.textContent=x.c;ttl.textContent=x.t;dsc.textContent=x.d;lb.textContent=x.inp;no.placeholder=x.ph;if(q.get("n"))no.value=q.get("n");
hint.textContent=x.auto?"Operator terdeteksi otomatis dari 4 digit pertama.":x.bill?"Tagihan muncul otomatis setelah ID diisi.":"Pastikan data benar, transaksi sukses tidak bisa dibatalkan.";
if(x.auto){pvs.classList.add("hidden");lc.textContent="2"}
const list=()=>(x.byp&&x.byp[P])||x.items||[];
const bill=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%9973;return 75000+(h*137)%250000};
const ck='<span class="ck"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"><path d="m5 12 5 5 9-10"/></svg></span>';
const items=()=>{if(x.bill){nl.textContent="Tagihan kamu";const n=no.value.trim();it.className="mt-4";it.innerHTML=n.length>5?`<div class="opt on rounded-2xl p-5 flex justify-between items-center gap-4"><div><b>Tagihan ${P}</b><p class="text-xs mut mt-1">Pelanggan •••${n.slice(-4)} · termasuk admin Rp2.500 · contoh</p></div><b class="disp text-xl whitespace-nowrap">${rp(bill(n+P))}</b></div>`:`<div class="rounded-2xl bg-[#FFF8E7] border border-dashed border-black/15 p-5 text-sm mut">Isi ${x.inp.toLowerCase()} dulu, tagihan muncul otomatis.</div>`;I=n.length>5?["Tagihan "+P,bill(n+P)]:null;return}
if(x.auto&&!P){it.innerHTML=`<div class="col-span-full rounded-2xl bg-[#FFF8E7] border border-dashed border-black/15 p-5 text-sm mut">Ketik nomor HP dulu, nominal muncul sesuai operatormu.</div>`;return}
const L=list();it.innerHTML=L.map((a,i)=>`<button data-i="${i}" class="nom opt rounded-2xl p-4 text-left min-h-[84px] flex flex-col justify-between ${I&&I[0]==a[0]?"on":""}">${ck}${i==Math.min(2,L.length-1)?`<span class="self-start text-[10px] font-bold uppercase tracking-wider bg-[#F3CFC9] rounded-full px-2 py-0.5 mb-2">Populer</span>`:""}<b class="block text-base leading-snug pr-5">${a[0]}</b><span class="text-sm text-[#930500] font-semibold mt-1">${rp(a[1])}</span></button>`).join("")};
pv.innerHTML=x.prov.map((p,i)=>`<button data-p="${p}" class="chip opt shrink-0 rounded-full pl-1.5 pr-4 py-1.5 text-sm font-medium flex items-center gap-2 ${i==0?"on":""}"><span class="av w-8 h-8 rounded-full bg-[#FFF8E7] text-[#930500] grid place-items-center text-xs font-bold">${p.replace(/[^A-Za-z0-9 ]/g,"").split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase()}</span>${p}</button>`).join("");
pv.onclick=e=>{const b=e.target.closest("button");if(!b)return;pv.querySelectorAll("button").forEach(z=>z.classList.remove("on"));b.classList.add("on");P=b.dataset.p;if(!x.bill)I=null;items();sum()};
it.onclick=e=>{const b=e.target.closest("button[data-i]");if(!b)return;I=list()[b.dataset.i];items();sum()};
no.oninput=()=>{if(x.auto){const n=no.value.replace(/\D/g,"").replace(/^62/,"0"),o=Object.keys(OP).find(o=>OP[o].includes(n.slice(0,4)))||null;if(o!==P){P=o;I=null}det.classList.toggle("hidden",!o);detn.textContent=o||""}items();sum()};
const okNo=()=>no.value.replace(/\D/g,"").length>=(x.auto?10:6);
const ok=()=>okNo()&&P&&I;
const sum=()=>{s1.classList.toggle("done",okNo());const r=[["Produk",x.t],["Provider",P||"–"],["Item",I?I[0]:"–"],["Tujuan",no.value||"–"]];sm.innerHTML=r.map(([a,b])=>`<div class="flex justify-between gap-4"><dt class="mut">${a}</dt><dd class="font-semibold text-right truncate">${b}</dd></div>`).join("");const t=I?rp(I[1]):"Rp0";tt.textContent=t;mt.textContent=t;mi.textContent=I?`${P} · ${I[0]}`:(okNo()?"Pilih nominal dulu":"Isi "+x.inp.toLowerCase()+" dulu");go.disabled=mgo.disabled=!ok()};
const pay=()=>{if(!ok())return;location.href=`/bayar?s=${k}&p=${encodeURIComponent(P)}&i=${encodeURIComponent(I[0])}&n=${encodeURIComponent(no.value.replace(/\s/g,""))}&a=${I[1]}`};go.onclick=mgo.onclick=pay;
no.oninput();
</script></body></html>
